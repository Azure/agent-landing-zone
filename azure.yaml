# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Agent Landing Zone: https://github.com/Azure/agent-landing-zone
name: agent-landing-zone
metadata:
  template: agent-landing-zone
infra:
  provider: bicep
  path: infra/bicep
  module: main  
hooks:
  predown:
    posix:
      shell: sh
      run: scripts/preDown.sh
      interactive: false
    windows:
      shell: pwsh
      run: scripts/preDown.ps1
      interactive: false
  preup:
    posix:
      shell: sh
      run: scripts/preUp.sh
      interactive: false
    windows:
      shell: pwsh
      run: scripts/preUp.ps1
      interactive: false
  preprovision:
    posix:
      shell: sh
      run: scripts/preProvision.sh
      interactive: true
    windows:
      shell: pwsh
      run: scripts/preProvision.ps1
      interactive: true
  postprovision:
    posix:
      shell: sh
      run: scripts/postProvision.sh
      interactive: true
    windows:
      shell: pwsh
      run: scripts/postProvision.ps1
      interactive: true
  predeploy:
    posix:
      shell: sh
      run: scripts/preDeploy.sh
      interactive: true
    windows:
      shell: pwsh
      run: scripts/preDeploy.ps1
      interactive: true