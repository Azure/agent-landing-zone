name: infra-validate

# Validates the repository-owned infrastructure in infra/ (ADR-0015).
# - build + lint run on every relevant change and need no Azure access.
# - what-if (and the what-if diff against the bicep-ptn-aiml-landing-zone
#   baseline recorded in manifest.json infra.source) runs only when Azure OIDC
#   secrets are configured; otherwise it is skipped with a notice.

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'main.parameters.json'
      - 'azure.yaml'
      - 'manifest.json'
      - '.github/workflows/infra-validate.yml'
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'infra/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'main.parameters.json'
      - 'azure.yaml'
      - 'manifest.json'
      - '.github/workflows/infra-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-contracts:
    name: deployment and hook contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest click tabulate -r config/requirements.txt

      - name: Prepare Bicep contract dependencies
        run: |
          set -euo pipefail
          az config set bicep.use_binary_from_path=false
          az bicep install --version v0.42.1
          az bicep restore --file infra/main.bicep
          echo "${AZURE_CONFIG_DIR:-$HOME/.azure}/bin" >> "$GITHUB_PATH"

      - name: Test deployment contracts
        run: python -m pytest tests --quiet

  build-and-lint:
    name: bicep build + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bicep CLI
        run: |
          set -euo pipefail
          az config set bicep.use_binary_from_path=false
          az bicep install --version v0.42.1
          az bicep version

      - name: Build infra/main.bicep
        run: az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/main.json"

      - name: Lint infra/main.bicep
        run: az bicep lint --file infra/main.bicep --diagnostics-format sarif > "$RUNNER_TEMP/bicep-lint.sarif"

      - name: Install offline PowerShell dependencies
        shell: pwsh
        run: Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Repository PSGallery -Force -ErrorAction Stop

      - name: Validate compiled foundation and deployment contracts
        shell: pwsh
        run: ./infra/tests/Invoke-OfflineContracts.ps1

      - name: Upload build and lint output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infra-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/main.json
            ${{ runner.temp }}/bicep-lint.sarif
          if-no-files-found: warn
          retention-days: 14

  azure-gate:
    name: Detect Azure OIDC configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && \
             [ -n "$AZURE_SUBSCRIPTION_ID" ] && [ -n "$AZURE_RESOURCE_GROUP" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Azure OIDC secrets or vars.AZURE_RESOURCE_GROUP not configured; skipping what-if."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  what-if:
    name: what-if + baseline diff
    needs: [build-and-lint, azure-gate]
    if: needs.azure-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_ENV_NAME: infraval${{ github.run_id }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read infra.source baseline from manifest.json
        id: source
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          s = json.load(open("manifest.json", encoding="utf-8"))["infra"]["source"]
          assert re.fullmatch(r"[0-9a-f]{40}", s["commit"]), "infra.source.commit must be a 40-char SHA"
          print(f"repo={s['repo']}")
          print(f"tag={s['tag']}")
          print(f"commit={s['commit']}")
          PY

      - name: Check out baseline (bicep-ptn-aiml-landing-zone)
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/baseline"
          git -C "$RUNNER_TEMP/baseline" fetch -q --depth 1 "${{ steps.source.outputs.repo }}" "${{ steps.source.outputs.commit }}"
          git -C "$RUNNER_TEMP/baseline" checkout -q FETCH_HEAD
          echo "Baseline ${{ steps.source.outputs.tag }} @ $(git -C "$RUNNER_TEMP/baseline" rev-parse HEAD)"

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run what-if for in-repo infra and baseline
        run: |
          set -euo pipefail
          resolve_params() {
            # Substitute azd-style ${VAR} placeholders; drop unset ones so Bicep defaults apply.
            python3 - "$1" "$2" <<'PY'
          import json, os, re, sys
          src, dst = sys.argv[1], sys.argv[2]
          text = re.sub(r"\$\{([A-Za-z0-9_]+)\}", lambda m: os.environ.get(m.group(1), ""), open(src, encoding="utf-8").read())
          doc = json.loads(text)
          doc["parameters"] = {k: v for k, v in doc.get("parameters", {}).items() if v.get("value", None) != ""}
          json.dump(doc, open(dst, "w", encoding="utf-8"))
          PY
          }
          run_what_if() {
            local dir="$1" out="$2" params="$3"
            resolve_params "$params" "$RUNNER_TEMP/$out.parameters.json"
            az deployment group what-if \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "infra-validate-$out-${{ github.run_id }}" \
              --template-file "$dir/main.bicep" \
              --parameters "@$RUNNER_TEMP/$out.parameters.json" \
              --result-format ResourceIdOnly --no-pretty-print --output json \
              > "$RUNNER_TEMP/$out.whatif.json"
          }
          # infra/main.parameters.json is generated by preProvision and not tracked;
          # the repository-root main.parameters.json is its source.
          run_what_if infra current main.parameters.json
          run_what_if "$RUNNER_TEMP/baseline" baseline "$RUNNER_TEMP/baseline/main.parameters.json"

      - name: Diff what-if results (FR-010b)
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/baseline.whatif.json" "$RUNNER_TEMP/current.whatif.json" <<'PY'
          import json, sys
          def changes(path):
              doc = json.load(open(path, encoding="utf-8"))
              return {(c["resourceId"].lower(), c["changeType"]) for c in doc.get("changes", [])}
          base, cur = changes(sys.argv[1]), changes(sys.argv[2])
          added, removed = sorted(cur - base), sorted(base - cur)
          for rid, ct in added:
              print(f"::error::Unexpected change vs baseline: {ct} {rid}")
          for rid, ct in removed:
              print(f"::error::Missing change vs baseline: {ct} {rid}")
          if added or removed:
              sys.exit(1)
          print(f"what-if matches baseline ({len(cur)} resource changes).")
          PY

      - name: Upload what-if results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infra-whatif-${{ github.run_id }}
          path: ${{ runner.temp }}/*.whatif.json
          if-no-files-found: warn
          retention-days: 14
