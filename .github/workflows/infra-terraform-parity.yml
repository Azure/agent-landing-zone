name: infra-terraform-parity

# Bicep in infra/ is the source of truth (research R5). When it changes on
# main, open a sync PR against the Terraform AVM module so a maintainer can
# port the change. Nothing is merged automatically:
# - this job runs in the `terraform-parity-publication` environment, which
#   must be configured with required reviewers (human approval to publish);
# - the PR is opened as a draft and assigned for review; merge in the
#   Terraform repository is governed by its own branch protection.
# Requires secrets PARITY_DISPATCH_APP_ID / PARITY_DISPATCH_APP_PRIVATE_KEY
# for a GitHub App installed on the Terraform repository only.

on:
  push:
    branches:
      - main
    paths:
      - 'infra/main.bicep'
      - 'infra/modules/**'
      - 'infra/constants/**'
      - 'main.parameters.json'
  workflow_dispatch:
    inputs:
      base:
        description: Bicep commit to diff from (defaults to the previous commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: infra-terraform-parity
  cancel-in-progress: false

env:
  TERRAFORM_OWNER: Azure
  TERRAFORM_REPO: terraform-azurerm-avm-ptn-aiml-landing-zone

jobs:
  open-parity-pr:
    name: Open Terraform parity PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: terraform-parity-publication
    permissions:
      contents: read
    steps:
      - name: Check out Agent Landing Zone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Summarize Bicep changes
        id: diff
        env:
          BASE_INPUT: ${{ inputs.base }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_INPUT:-${BEFORE:-}}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1)"
          fi
          paths=(infra/main.bicep infra/modules infra/constants main.parameters.json)
          git diff --stat "$base" HEAD -- "${paths[@]}" > "$RUNNER_TEMP/stat.txt"
          if [ ! -s "$RUNNER_TEMP/stat.txt" ]; then
            echo "No Bicep changes between $base and HEAD."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff "$base" HEAD -- "${paths[@]}" > "$RUNNER_TEMP/bicep.diff"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Mint single-repository App token
        if: steps.diff.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PARITY_DISPATCH_APP_ID }}
          private-key: ${{ secrets.PARITY_DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ env.TERRAFORM_OWNER }}
          repositories: ${{ env.TERRAFORM_REPO }}

      - name: Open draft parity PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ steps.diff.outputs.base }}
          HEAD_SHA: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          target="$TERRAFORM_OWNER/$TERRAFORM_REPO"
          branch="parity/bicep-${HEAD_SHA:0:12}"
          workdir="$RUNNER_TEMP/terraform"
          gh repo clone "$target" "$workdir" -- --depth 1
          cd "$workdir"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Parity branch $branch already exists; nothing to do."
            exit 0
          fi
          git switch -c "$branch"
          mkdir -p parity/handoffs
          handoff="parity/handoffs/${HEAD_SHA:0:12}.md"
          {
            echo "# Bicep to Terraform parity handoff"
            echo
            echo "- Source: https://github.com/$SOURCE_REPO"
            echo "- Bicep range: \`$BASE_SHA..$HEAD_SHA\`"
            echo "- Compare: https://github.com/$SOURCE_REPO/compare/$BASE_SHA...$HEAD_SHA"
            echo
            echo "## Changed Bicep files"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/stat.txt"
            echo '```'
            echo
            echo "## Diff"
            echo
            echo '```diff'
            head -c 60000 "$RUNNER_TEMP/bicep.diff"
            echo '```'
          } > "$handoff"
          git config user.name "agentlz-parity[bot]"
          git config user.email "agentlz-parity[bot]@users.noreply.github.com"
          git add "$handoff"
          git commit -q -m "Parity handoff for Bicep ${HEAD_SHA:0:12}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/$target.git" "$branch"
          gh pr create --repo "$target" --draft \
            --head "$branch" --base "$(gh repo view "$target" --json defaultBranchRef --jq .defaultBranchRef.name)" \
            --title "Parity: port Bicep changes ${HEAD_SHA:0:12} from $SOURCE_REPO" \
            --body "Automated parity handoff from the Agent Landing Zone Bicep source of truth (\`$SOURCE_REPO\` \`infra/\`).

          **Human review required.** A maintainer must port the Terraform changes described in \`$handoff\`, validate them, and approve before merge. Do not merge this PR as-is."
