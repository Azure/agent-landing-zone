name: Release validation (network isolated)

# Validates a published Agent Landing Zone release with live Azure deployments
# of the standard scenario (util/release-validation/scenario.env) with Bicep
# and Terraform, one provider after the other.
#
# A release is published as a pre-release. When both providers pass, the
# promote job attaches the evidence to the release, amends its notes and makes
# it the Latest release. "Validated" means the Latest release. Every day the
# current Latest release is revalidated without promotion, and a failure opens
# an issue. release-validation-cleanup.yml removes leftovers daily.
#
# The GitHub-hosted jobs never reach private endpoints. They sign in with OIDC
# (no stored secret), start the executor VM in the persistent validation hub,
# launch util/release-validation/run-validation.sh on it through Azure Run
# Command and follow the evidence the VM uploads. The VM provisions a fresh
# spoke, connects it to the hub, deploys, runs the agent smoke test and always
# tears the spoke down. One-time setup: util/release-validation/bootstrap-hub.sh.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to validate (for example v7.5.2). Empty means the Latest release."
        required: false
        default: ""
        type: string
      providers:
        description: "Providers to validate. Promotion requires both."
        required: true
        default: both
        type: choice
        options:
          - both
          - bicep
          - terraform
      location:
        description: "Azure region for the validation landing zones"
        required: true
        default: swedencentral
        type: string
      hosted_agent_resource_scope:
        description: "HOSTED_AGENT_RESOURCE_SCOPE for the hosted orchestrator"
        required: true
        default: https://ai.azure.com/.default
        type: string
      promote:
        description: "When both providers pass, attach the evidence and make the release Latest"
        required: true
        default: true
        type: boolean
      keep_environment:
        description: "Keep the validation landing zones instead of tearing them down"
        required: true
        default: false
        type: boolean
  schedule:
    # Daily revalidation of the Latest release, both providers, no promotion.
    # Kept away from the nightly governance shutdown window (about 00:00-05:00
    # UTC) that deallocates the executor VM in some subscriptions.
    - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  # Terraform runs with -lock=false under azd and the hub links private DNS
  # zones by name, so validations must never overlap.
  group: release-validation
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release and providers
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      providers: ${{ steps.resolve.outputs.providers }}
      promote: ${{ steps.resolve.outputs.promote }}
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_TAG: ${{ inputs.release_tag }}
      INPUT_PROVIDERS: ${{ inputs.providers }}
      INPUT_PROMOTE: ${{ inputs.promote }}
    steps:
      - name: Resolve release tag and providers
        id: resolve
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            INPUT_TAG=""; INPUT_PROVIDERS="both"; INPUT_PROMOTE="false"
          fi
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::release tag must look like vX.Y.Z (got '$tag')"; exit 1; }
          read -r draft prerelease < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease -q '"\(.isDraft) \(.isPrerelease)"')
          [ "$draft" = "false" ] || { echo "::error::$tag is a draft release"; exit 1; }
          case "${INPUT_PROVIDERS:-both}" in
            both) providers='["bicep","terraform"]' ;;
            bicep|terraform) providers="[\"$INPUT_PROVIDERS\"]" ;;
            *) echo "::error::providers must be both, bicep or terraform"; exit 1 ;;
          esac
          echo "Release $tag (pre-release: $prerelease), providers $providers, promote ${INPUT_PROMOTE:-false}"
          {
            echo "tag=$tag"
            echo "providers=$providers"
            echo "promote=${INPUT_PROMOTE:-false}"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Validate ${{ needs.prepare.outputs.tag }} (${{ matrix.provider }})
    needs: prepare
    runs-on: ubuntu-latest
    environment: release-validation
    timeout-minutes: 360
    strategy:
      # One provider at a time: both spokes would create the same privatelink
      # DNS zone names in the hub, and Terraform runs with -lock=false.
      max-parallel: 1
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.prepare.outputs.providers) }}
    permissions:
      contents: read
      id-token: write # Azure OIDC
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PROVIDER: ${{ matrix.provider }}
      AZ_LOCATION: ${{ inputs.location || 'swedencentral' }}
      HOSTED_SCOPE: ${{ inputs.hosted_agent_resource_scope || 'https://ai.azure.com/.default' }}
      KEEP_ENVIRONMENT: ${{ inputs.keep_environment && 'true' || 'false' }}
      RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.provider }}
      HUB_RG: ${{ vars.RELVAL_HUB_RESOURCE_GROUP }}
      HUB_VM: ${{ vars.RELVAL_HUB_VM_NAME }}
      STORAGE_ACCOUNT: ${{ vars.RELVAL_STORAGE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: util/release-validation
          persist-credentials: false

      - name: Check inputs
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          [[ "$RUN_KEY" =~ ^[0-9A-Za-z-]{1,40}$ ]] || { echo "::error::Invalid run key $RUN_KEY"; exit 1; }
          [[ "$AZ_LOCATION" =~ ^[a-z0-9]+$ ]] || { echo "::error::location must be an Azure region name"; exit 1; }
          [[ "$HOSTED_SCOPE" =~ ^[A-Za-z0-9:/._-]+/\.default$ ]] || { echo "::error::scope must end with /.default"; exit 1; }
          for name in RELVAL_AZURE_CLIENT_ID RELVAL_AZURE_TENANT_ID RELVAL_AZURE_SUBSCRIPTION_ID \
            RELVAL_HUB_RESOURCE_GROUP RELVAL_HUB_VM_NAME RELVAL_HUB_VNET_ID RELVAL_EXECUTOR_CLIENT_ID RELVAL_STORAGE_ACCOUNT; do
            [ -n "$(jq -r --arg n "$name" '.[$n] // empty' <<< "$VARS_JSON")" ] || { echo "::error::Missing environment variable $name. Run util/release-validation/bootstrap-hub.sh."; exit 1; }
          done
          echo "::add-mask::${{ vars.RELVAL_AZURE_SUBSCRIPTION_ID }}"
          echo "::add-mask::${{ vars.RELVAL_AZURE_TENANT_ID }}"

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.RELVAL_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.RELVAL_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.RELVAL_AZURE_SUBSCRIPTION_ID }}

      - name: Start executor VM
        run: |
          set -euo pipefail
          # The previous provider's VM may still be finishing its own deallocation.
          for attempt in 1 2 3 4 5 6; do
            az vm start -g "$HUB_RG" -n "$HUB_VM" --only-show-errors && break
            [ "$attempt" -lt 6 ] || exit 1
            sleep 60
          done
          az vm run-command invoke -g "$HUB_RG" -n "$HUB_VM" --command-id RunShellScript \
            --scripts @util/release-validation/install-tools.sh --query 'value[0].message' -o tsv --only-show-errors

      - name: Launch validation on the executor
        env:
          SUBSCRIPTION_ID: ${{ vars.RELVAL_AZURE_SUBSCRIPTION_ID }}
          TENANT_ID: ${{ vars.RELVAL_AZURE_TENANT_ID }}
          EXECUTOR_CLIENT_ID: ${{ vars.RELVAL_EXECUTOR_CLIENT_ID }}
          HUB_VNET_ID: ${{ vars.RELVAL_HUB_VNET_ID }}
        run: |
          set -euo pipefail
          bash util/release-validation/launch.sh > launcher.sh
          az vm run-command invoke -g "$HUB_RG" -n "$HUB_VM" --command-id RunShellScript \
            --scripts @launcher.sh --query 'value[0].message' -o tsv --only-show-errors | tee launch.out
          grep -q "launched relval-$RUN_KEY" launch.out

      - name: Follow validation
        timeout-minutes: 340
        run: bash util/release-validation/vm-evidence.sh follow evidence

      - name: Collect evidence
        if: always()
        run: |
          set -uo pipefail
          bash util/release-validation/vm-evidence.sh collect evidence || echo "::warning::Evidence could not be collected from the executor."
          python3 util/release-validation/evidence.py report \
            --evidence-dir evidence --release "$RELEASE_TAG" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --redact "${{ vars.RELVAL_AZURE_SUBSCRIPTION_ID }}" --redact "${{ vars.RELVAL_AZURE_TENANT_ID }}" \
            --redact "${{ vars.RELVAL_EXECUTOR_CLIENT_ID }}" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation-${{ needs.prepare.outputs.tag }}-${{ matrix.provider }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Stop executor VM
        if: always()
        run: |
          state="$(jq -r '.state // empty' evidence/status.json 2>/dev/null)"
          if [ "$state" = "completed" ] || [ ! -s evidence/status.json ]; then
            # Synchronous, so the next provider's start does not race it.
            az vm deallocate -g "$HUB_RG" -n "$HUB_VM" --only-show-errors
          else
            echo "::warning::Validation still running on the executor; it tears down and deallocates itself."
          fi

      - name: Check result
        run: |
          result="$(jq -r '.result // empty' evidence/status.json 2>/dev/null)"
          provider="$(jq -r '.provider // empty' evidence/status.json 2>/dev/null)"
          echo "Validation result ($provider): ${result:-unknown}"
          [ "$result" = "passed" ] && [ "$provider" = "$PROVIDER" ]

  promote:
    name: Promote ${{ needs.prepare.outputs.tag }} to Latest
    needs: [prepare, validate]
    if: >-
      needs.prepare.outputs.promote == 'true' &&
      needs.prepare.outputs.providers == '["bicep","terraform"]' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # release assets, notes and Latest flag
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: util/release-validation
          persist-credentials: false

      - name: Download evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-validation-${{ needs.prepare.outputs.tag }}-*-${{ github.run_id }}
          path: artifacts

      - name: Attach evidence and amend release notes
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          before="$(grep -c '^## ' notes.md || true)"
          for provider in bicep terraform; do
            dir="artifacts/release-validation-$RELEASE_TAG-$provider-$GITHUB_RUN_ID"
            [ "$(jq -r '.result' "$dir/status.json")" = "passed" ] || { echo "::error::$provider did not pass"; exit 1; }
            [ "$(jq -r '.provider' "$dir/status.json")" = "$provider" ] || { echo "::error::$dir is not $provider evidence"; exit 1; }
            asset="validation-$RELEASE_TAG-$provider-$GITHUB_RUN_ID.md"
            cp "$dir/report.md" "$asset"
            gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
            python3 util/release-validation/evidence.py amend-notes --notes notes.md \
              --status "$dir/status.json" --run-url "$RUN_URL" \
              --asset-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$asset"
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > published.md
          after="$(grep -c '^## ' published.md || true)"
          echo "Headings at line start: before $before, after $after"
          grep -qx '## Validation' published.md || { echo "::error::Release notes lost the ## Validation heading"; exit 1; }
          [ "$after" -ge "$before" ] && [ "$after" -ge 1 ] || { echo "::error::Release notes formatting changed"; exit 1; }
          [ "$(grep -c '<!-- release-validation:' published.md)" -eq 2 ] || { echo "::error::Expected one evidence line per provider"; exit 1; }

      - name: Make the release Latest
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          [ "$latest" = "$RELEASE_TAG" ] || { echo "::error::Latest is $latest, expected $RELEASE_TAG"; exit 1; }
          echo "### $RELEASE_TAG validated with Bicep and Terraform and promoted to Latest" >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    name: Open issue for failed scheduled revalidation
    needs: [prepare, validate]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update issue
        run: |
          set -euo pipefail
          title="Scheduled release validation failed for ${RELEASE_TAG:-the Latest release}"
          body="The scheduled revalidation of the standard scenario failed: $RUN_URL

          Check the evidence artifacts of the run. Fix on a feature branch from develop, cut a patch release as a pre-release and run the release validation workflow for it."
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
