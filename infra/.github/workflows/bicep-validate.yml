name: bicep-validate

on:
  pull_request:
    paths:
      - 'main.bicep'
      - 'modules/**'
      - 'constants/**'
      - 'main.parameters.json'
      - 'manifest.json'
      - 'CHANGELOG.md'
      - 'scripts/ReleaseMetadata.ps1'
      - 'scripts/WorkflowYaml.ps1'
      - 'tests/scripts/WorkflowYaml.Tests.ps1'
      - 'scripts/Measure-MainJsonSize.ps1'
      - 'scripts/Invoke-PreflightChecks.ps1'
      - 'tests/contracts/**'
      - 'tests/scripts/Measure-MainJsonSize.Tests.ps1'
      - 'tests/scripts/Invoke-PreflightChecks.Tests.ps1'
      - 'AGENTS.md'
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - '.github/scripts/Validate-CopilotAssets.ps1'
      - 'tests/scripts/Validate-CopilotAssets.Tests.ps1'
      - '.github/workflows/bicep-validate.yml'
  push:
    branches:
      - main
      - 'v2.*-dev'
    paths:
      - 'main.bicep'
      - 'modules/**'
      - 'constants/**'
      - 'main.parameters.json'
      - 'manifest.json'
      - 'CHANGELOG.md'
      - 'scripts/ReleaseMetadata.ps1'
      - 'scripts/WorkflowYaml.ps1'
      - 'tests/scripts/WorkflowYaml.Tests.ps1'
      - 'scripts/Measure-MainJsonSize.ps1'
      - 'scripts/Invoke-PreflightChecks.ps1'
      - 'tests/contracts/**'
      - 'tests/scripts/Measure-MainJsonSize.Tests.ps1'
      - 'tests/scripts/Invoke-PreflightChecks.Tests.ps1'
      - 'AGENTS.md'
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - '.github/scripts/Validate-CopilotAssets.ps1'
      - 'tests/scripts/Validate-CopilotAssets.Tests.ps1'
      - '.github/workflows/bicep-validate.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-copilot-assets:
    name: Copilot assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install YAML parser
        shell: pwsh
        run: Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force

      - name: Validate agents, skills, and scoped instructions
        shell: pwsh
        run: pwsh ./.github/scripts/Validate-CopilotAssets.ps1

      - name: Test Copilot asset validator
        shell: pwsh
        run: pwsh ./tests/scripts/Validate-CopilotAssets.Tests.ps1

  build-and-measure:
    name: bicep build + size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bicep CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64 -o bicep
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Compile main.bicep and check size
        shell: pwsh
        run: |
          # The script defaults are the single source of truth for local and CI gates.
          pwsh ./scripts/Measure-MainJsonSize.ps1

      - name: Test compiled-template size gate
        shell: pwsh
        run: pwsh ./tests/scripts/Measure-MainJsonSize.Tests.ps1

      - name: Validate release metadata and trigger coverage
        shell: pwsh
        run: pwsh ./tests/contracts/Test-ReleaseMetadataContract.ps1

      - name: Test workflow YAML reader
        shell: pwsh
        run: pwsh ./tests/scripts/WorkflowYaml.Tests.ps1

      - name: Validate hosted-agent resource contract
        shell: pwsh
        run: |
          az bicep uninstall
          az bicep install --version v0.42.1
          pwsh ./tests/contracts/Test-HostedAgentContract.ps1

      - name: Validate ACR Task agent pool firewall contract
        shell: pwsh
        run: pwsh ./tests/contracts/Test-AcrTaskAgentPoolFirewallContract.ps1

      - name: Validate ACR Task agent pool subnet ordering
        shell: pwsh
        run: pwsh ./tests/contracts/Test-AcrTaskAgentPoolSubnetContract.ps1

      - name: Validate solution Storage access contract
        shell: pwsh
        run: pwsh ./tests/contracts/Test-SolutionStorageAccessContract.ps1

      - name: Validate firewall Agent365 observability contract
        shell: pwsh
        run: pwsh ./tests/contracts/Test-FirewallAgent365ObservabilityContract.ps1

      - name: Validate Foundry shared private-link names
        shell: pwsh
        run: pwsh ./tests/contracts/Test-FoundrySharedPrivateLinkNameContract.ps1

      - name: Validate Maintenance Configuration wrapper forwarding
        shell: pwsh
        run: pwsh ./tests/contracts/Test-MaintenanceConfigurationWrapperContract.ps1

      - name: Validate component deployment flag contract
        shell: pwsh
        run: pwsh ./tests/contracts/Test-ComponentDeploymentFlagsContract.ps1

      - name: Validate Cosmos DB deployment names
        shell: pwsh
        run: pwsh ./tests/contracts/Test-CosmosDeploymentNameContract.ps1

      - name: Run deterministic preflight tests
        shell: pwsh
        run: pwsh ./tests/scripts/Invoke-PreflightChecks.Tests.ps1

      - name: Upload main.json artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-json-${{ github.run_id }}
          path: main.json
          if-no-files-found: warn
          retention-days: 14
